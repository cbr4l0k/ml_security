[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-security"
version = "0.1.0"
description = "ML Security Challenge Suite — adversarial attacks, perturbation detection, model extraction, and backdoor detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "numpy",
    "Pillow",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
ml = [
    "torch",
    "scikit-learn",
]
notebook = [
    "jupyterlab",
    "ipykernel",
    "matplotlib",
    "pandas",
]

[project.scripts]
ml-security = "ml_security.cli:main"
